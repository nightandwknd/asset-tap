# cargo-audit configuration.
#
# The advisories ignored below are DoS issues in `quick-xml`, pulled in only as
# a transitive dependency of the Linux windowing stack — `wayland-scanner` and
# `zbus_xml` (via winit / egui-winit / eframe and the accesskit accessibility
# tree). Neither intermediate crate has released a version that depends on a
# fixed `quick-xml` (>= 0.41.0), so the fix is not reachable by a lockfile bump:
# `cargo update` can only advance `quick-xml` to 0.39.x, which is still
# affected. Reaching a fixed version requires upgrading the whole pinned
# egui / winit / three-d stack together — a deliberate, coordinated effort (see
# CLAUDE.md §10 "egui/three-d version compatibility"), not a piecemeal bump.
#
# These are parser DoS vectors (memory / CPU exhaustion on adversarial XML).
# The XML `quick-xml` parses here is Wayland protocol definitions and D-Bus
# introspection XML generated by the local desktop environment at build/run
# time — not attacker-controlled network input — so the practical exposure is
# low. Revisit and remove these entries the next time the egui/three-d stack is
# upgraded.
[advisories]
ignore = [
  "RUSTSEC-2026-0194", # quick-xml: quadratic run time on duplicate-attribute check
  "RUSTSEC-2026-0195", # quick-xml: unbounded namespace-declaration allocation
]
