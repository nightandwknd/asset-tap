[workspace]
resolver = "2"
members = ["cli", "core", "gui"]

[workspace.package]
version = "26.8.10"
authors = ["Night and Wknd"]
categories = ["multimedia", "graphics", "command-line-utilities"]
edition = "2024"
homepage = "https://assettap.dev"
keywords = ["3d", "ai", "text-to-3d", "asset-generation", "blender"]
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/nightandwknd/asset-tap"

[workspace.dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# HTTP client - unified approach for all API calls
reqwest = { version = "0.12", features = ["json", "multipart", "stream"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Error handling
anyhow = "1"
thiserror = "2"

# Utilities
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
dirs = "6"
walkdir = "2"
which = "7"

# Env loading
dotenvy = "0.15"

# CLI
clap = { version = "4", features = ["derive"] }
indexmap = "2"

# GUI (egui 0.34 uses glow 0.17, matching three-d 0.19)
# eframe default features include wgpu since 0.34, and the runtime prefers wgpu
# when both renderers are compiled in — but the three-d viewer needs eframe's
# glow context, so glow must be the ONLY renderer. Defaults off, native platform
# features re-added by hand (see also the direct winit dep in gui/Cargo.toml).
eframe = { version = "0.34", default-features = false, features = ["accesskit", "default_fonts", "glow", "wayland", "x11"] }
egui = "0.34"
egui_extras = { version = "0.34", features = ["all_loaders"] }

# 3D rendering
gltf = { version = "1.4", features = ["KHR_materials_unlit", "extras"] }
# default-features off: the "window" feature is three-d's own glutin/winit
# windowing, unused here — eframe owns the window and we build a three-d
# Context from its glow context.
three-d = { version = "0.19", default-features = false }
three-d-asset = { version = "0.10", features = ["gltf", "image"] }

# OpenGL context (must match eframe's glow version)
glow = "0.17"

# Phosphor icons for GUI (0.12 targets egui 0.34)
egui-phosphor = { version = "0.12", default-features = false, features = ["regular"] }

# File dialogs
rfd = "0.15"

# Image handling
image = { version = "0.25", features = ["webp"] }

# Open files/URLs in default application
open = "5"

# Async utilities
async-trait = "0.1"
futures = "0.3"

# Archive
zip = { version = "2", default-features = false, features = ["deflate"] }

# Tracing/logging
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
strip = true
lto = true
codegen-units = 1
