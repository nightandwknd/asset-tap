[package]
name = "asset-tap-gui"
version.workspace = true
categories.workspace = true
edition.workspace = true
homepage.workspace = true
keywords.workspace = true
license.workspace = true
readme.workspace = true
repository.workspace = true
description = "Asset Tap desktop app - open-source game asset generation pipeline"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[package.metadata.packager]
name = "Asset Tap"
product_name = "Asset Tap"
identifier = "com.nightandwknd.asset-tap"
category = "Graphics and Design"
description = "Game asset generation pipeline"
long_description = "Asset Tap turns a prompt, an image, or a mesh into a game-ready asset: concept art, a textured GLB, humanoid rigging with animation clips, all in one bundle. Desktop app, CLI, and MCP server. Open source, with generation routed to your chosen provider."
authors = ["Asset Tap Contributors"]
publisher = "nightandwknd"
homepage = "https://github.com/nightandwknd/asset-tap"
icons = ["../assets/icon.png", "../assets/icon.ico"]

# macOS-specific configuration
[package.metadata.packager.macos]
minimum_system_version = "10.15"

# Windows-specific configuration
[package.metadata.packager.windows]
allow_downgrades = true
# NSIS installer adds install dir to PATH so CLI is available in cmd/PowerShell

[[bin]]
name = "asset-tap-gui"
path = "src/main.rs"

[features]
default = []
mock = ["asset-tap-core/mock"]

[dependencies]
asset-tap-core = { path = "../core" }

# Serialization
serde_json = { workspace = true }

# Utilities
chrono = { workspace = true }

# GUI framework
eframe = { workspace = true }
egui = { workspace = true }
egui-phosphor = { workspace = true }
egui_extras = { workspace = true }

# 3D rendering
glow = { workspace = true }
gltf = { workspace = true }
three-d = { workspace = true }
three-d-asset = { workspace = true }

# File dialogs
rfd = { workspace = true }

# Async runtime
tokio = { workspace = true }

# Image handling
image = { workspace = true }

# Env loading
dotenvy = { workspace = true }

# Tracing/logging
tracing = { workspace = true }
tracing-appender = { workspace = true }
tracing-subscriber = { workspace = true }

# Async utilities
futures = { workspace = true }

# Archive
zip = { workspace = true }

# Open files/URLs in default application
open = { workspace = true }

# eframe is built with default-features = false to keep the wgpu renderer out
# (glow-only; see root Cargo.toml). That also drops eframe's `winit/default`,
# losing winit's Wayland runtime features. Re-enable them here via feature
# unification: dlopen keeps the AppImage running on X11-only systems,
# csd-adwaita provides window decorations on GNOME Wayland.
[target.'cfg(target_os = "linux")'.dependencies]
winit = { version = "0.30.13", default-features = false, features = ["wayland-dlopen", "wayland-csd-adwaita"] }

[package.metadata.cargo-udeps.ignore]
normal = ["winit"]

[dev-dependencies]
tempfile = "3.8"

[target.'cfg(windows)'.build-dependencies]
tauri-winres = "0.2"
