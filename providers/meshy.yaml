# Meshy AI Provider Configuration
# Native Meshy API — text-to-image and image-to-3D
# Exists so users can run the full pipeline with only a Meshy key
# (no fal.ai key required).

# YAML anchors for reusable configuration blocks
x-meshy-auth: &meshy-auth
  Authorization: 'Bearer ${MESHY_API_KEY}'

x-meshy-request-headers: &meshy-request-headers
  <<: *meshy-auth
  Content-Type: 'application/json'

# Meshy returns {"result": "<task-id>"} on task creation and requires polling a
# separate URL built from the task id. status_url_template does that substitution.
x-meshy-t2i-polling: &meshy-t2i-polling
  status_field: 'result'
  status_url_template: '/openapi/v1/text-to-image/${result}'
  status_check_field: 'status'
  success_value: 'SUCCEEDED'
  # Meshy's documented task statuses are PENDING, IN_PROGRESS, SUCCEEDED,
  # FAILED and CANCELED. A status matching neither success nor failure is
  # treated as still running, so a task canceled server-side (e.g. from the
  # Meshy dashboard) would poll to the attempt limit without CANCELED listed.
  failure_value: ['FAILED', 'CANCELED']
  result_field: 'image_urls[0]'
  interval_ms: 1500
  max_attempts: 120
  # Meshy cancels via DELETE on the same task URL (no URL rewrite needed).
  cancel_url_template: '${status_url}'
  cancel_method: DELETE

x-meshy-i23d-polling: &meshy-i23d-polling
  status_field: 'result'
  status_url_template: '/openapi/v1/image-to-3d/${result}'
  status_check_field: 'status'
  success_value: 'SUCCEEDED'
  # Meshy's documented task statuses are PENDING, IN_PROGRESS, SUCCEEDED,
  # FAILED and CANCELED. A status matching neither success nor failure is
  # treated as still running, so a task canceled server-side (e.g. from the
  # Meshy dashboard) would poll to the attempt limit without CANCELED listed.
  failure_value: ['FAILED', 'CANCELED']
  result_field: 'model_urls.glb'
  interval_ms: 2000
  max_attempts: 300
  cancel_url_template: '${status_url}'
  cancel_method: DELETE

# Shared parameter lists. YAML anchor+alias replaces the whole list, which is
# exactly what we want here — every model in a family exposes the same knobs.
#
# aspect_ratio options are NOT shared across the whole provider: the
# nano-banana family takes one set and gpt-image-2 takes a different one
# (see its own block below). Only reuse this anchor for nano-banana models.
x-meshy-t2i-params: &meshy-t2i-params
  - name: 'aspect_ratio'
    label: 'Aspect Ratio'
    # Meshy rejects the request if aspect_ratio is sent alongside
    # generate_multi_view=true — it is not merely ignored. Declared here so
    # turning Multi-View on drops the default aspect ratio automatically and
    # greys the dropdown out, instead of leaving the user to discover the
    # rejection from the API.
    description: 'Output image aspect ratio. Cannot be combined with Multi-View.'
    type: select
    conflicts_with: { generate_multi_view: true }
    # Still clearable by hand: the conflict covers Multi-View, allow_unset
    # covers wanting Meshy's own default. GUI dropdowns get an "(unset)"
    # entry, CLI uses `--param aspect_ratio=`.
    allow_unset: true
    default: '1:1'
    options: ['1:1', '16:9', '9:16', '4:3', '3:4']
  - name: 'generate_multi_view'
    label: 'Multi-View'
    description: 'Generate 3 views of the subject instead of 1. Improves image-to-3D quality for some subjects. Turning this on clears Aspect Ratio.'
    type: boolean
    default: false
  - name: 'pose_mode'
    label: 'Pose'
    description: 'Force a standard character pose. Leave blank for automatic.'
    type: select
    default: ''
    options: ['', 'a-pose', 't-pose']
  - name: 'remove_background'
    label: 'Remove Background'
    description: 'Return the image as a transparent RGBA PNG with the background removed. Ideal for sprites and image-to-3D inputs.'
    type: boolean
    default: false

# NOTE: YAML sequences can't be extended via merge keys, so the image-to-3D
# parameter lists below (under `parameters:` in each model block) are
# intentionally duplicated. Keep them in sync except for these deltas, which
# `meshy_v6_parameter_surface_matches_across_providers` enforces:
#   - should_remesh default: Meshy documents "false (Meshy 6 and Meshy 7
#     models), true (others)". v6-lite inherits meshy-5's true, since Meshy
#     documents it as the meshy-5 successor "with the same parameters".
#   - texture_resolution: Meshy's only restriction is value-level — "The 4k
#     and 8k options are unavailable with meshy-6-lite" — so v6-lite omits the
#     knob rather than shipping a 2k-only dropdown with nothing to choose.
#   - image_enhancement is documented "only available with meshy-6, meshy-7.1,
#     or latest", so v6-lite omits it.
#   - remove_lighting is documented "supported only with meshy-6", so v6 alone
#     exposes it.
#   - geometry_resolution is documented "Requires meshy-7.1 or latest", so v7
#     alone exposes it. It replaces ultra_mode, which Meshy deprecated
#     ("ultra_mode: true is equivalent to geometry_resolution: '2k'").
#   - symmetry_mode is deprecated API-wide ("This parameter no longer affects
#     output"), so it is no longer advertised as a parameter on ANY model. It
#     still rides along in the shared request-body anchor, which is harmless:
#     Meshy accepts and ignores it.
# The surfaces are also aligned with fal's wrappers (fal-ai/meshy/v6/
# image-to-3d and, since 2026-08, meshy/v7/image-to-3d under fal's partner
# namespace) so users see the same knobs regardless of which provider serves
# the model — minus the native-only params each fal wrapper doesn't expose
# (confirmed against fal's OpenAPI, 2026-09-18): texture_prompt passes through
# on both wrappers; v6's lacks texture_resolution/remove_lighting/
# image_enhancement, v7's lacks texture_resolution/image_enhancement.
# fal's v7 wrapper also caps geometry_resolution at standard/2k ("Meshy-7
# supports standard and 2k") where the native API adds 4k.

# Shared image-to-3D request body. Per-version overrides (e.g. should_remesh)
# go on each model block below.
x-meshy-i23d-body: &meshy-i23d-body
  image_url: '${image_url}'
  topology: 'triangle'
  target_polycount: 30000
  enable_pbr: false
  should_texture: true
  symmetry_mode: 'auto'
  pose_mode: ''
  target_formats: ['glb']
  auto_size: false
  # Dropped unless auto_size is on (see the parameter's `requires`).
  origin_at: 'bottom'
  # Null = unset: stripped from the request so Meshy applies its own default
  # unless the user supplies one. decimation_mode additionally needs a remesh
  # pass, so it is dropped whenever should_remesh is off.
  decimation_mode: null
  texture_prompt: null

provider:
  id: 'meshy'
  name: 'Meshy AI'
  description: 'Native Meshy API — text-to-image and production-grade image-to-3D'
  env_vars:
    - 'MESHY_API_KEY'
  base_url: 'https://api.meshy.ai'
  auth_format: 'Bearer ${MESHY_API_KEY}'
  api_key_url: 'https://www.meshy.ai/settings/api'
  website_url: 'https://www.meshy.ai'
  docs_url: 'https://docs.meshy.ai/en/api/quick-start'
  # Meshy has no file upload endpoint — image-to-3D accepts inline
  # `data:image/png;base64,...` URIs directly. The pipeline falls back to
  # data-URI encoding automatically when `upload` is absent.

# =============================================================================
# Text-to-Image (verified 2026-04-15; remove_background added + re-verified 2026-08-19)
# =============================================================================
text_to_image:
  # --- Nano Banana ---
  # Meshy's standard text-to-image model. Shares naming with fal's nano-banana;
  # Meshy does not publicly document the underlying architecture.
  - id: 'meshy/nano-banana'
    name: 'Nano Banana'
    description: 'Meshy text-to-image — standard quality'
    is_default: true
    endpoint: '/openapi/v1/text-to-image'
    method: POST
    request:
      headers:
        <<: *meshy-request-headers
      body:
        ai_model: 'nano-banana'
        prompt: '${prompt}'
        aspect_ratio: '1:1'
        generate_multi_view: false
        pose_mode: ''
        remove_background: false
    response:
      response_type: polling
      polling:
        <<: *meshy-t2i-polling
    parameters: *meshy-t2i-params

  # --- Nano Banana 2 ---
  # Mid tier: 6 credits/image vs 3 for nano-banana, 9 for pro.
  - id: 'meshy/nano-banana-2'
    name: 'Nano Banana 2'
    description: 'Meshy text-to-image — mid tier (6 credits)'
    endpoint: '/openapi/v1/text-to-image'
    method: POST
    request:
      headers:
        <<: *meshy-request-headers
      body:
        ai_model: 'nano-banana-2'
        prompt: '${prompt}'
        aspect_ratio: '1:1'
        generate_multi_view: false
        pose_mode: ''
        remove_background: false
    response:
      response_type: polling
      polling:
        <<: *meshy-t2i-polling
    parameters: *meshy-t2i-params

  # --- Nano Banana Pro ---
  # Higher quality tier with the same parameter surface.
  - id: 'meshy/nano-banana-pro'
    name: 'Nano Banana Pro'
    description: 'Meshy text-to-image — higher quality (9 credits)'
    endpoint: '/openapi/v1/text-to-image'
    method: POST
    request:
      headers:
        <<: *meshy-request-headers
      body:
        ai_model: 'nano-banana-pro'
        prompt: '${prompt}'
        aspect_ratio: '1:1'
        generate_multi_view: false
        pose_mode: ''
        remove_background: false
    response:
      response_type: polling
      polling:
        <<: *meshy-t2i-polling
    parameters: *meshy-t2i-params

  # --- GPT Image 2 ---
  # Different architecture, and a DIFFERENT aspect-ratio set. It is now a
  # strict SUPERSET of the nano-banana family's: Meshy documents
  # "gpt-image-2, gpt-image-2-5-flare, gpt-image-2-5-sunburst: 1:1, 16:9,
  # 9:16, 4:3, 3:4, 3:2, 2:3" against the nano-banana family's
  # "1:1, 16:9, 9:16, 4:3, 3:4". The split from *meshy-t2i-params therefore
  # stays — the sets still differ — but the direction flipped: gpt-image-2 is
  # the one with extra ratios (3:2 and 2:3, the common wide/tall sprite
  # ratios), not the restricted one.
  - id: 'meshy/gpt-image-2'
    name: 'GPT Image 2'
    description: 'Meshy text-to-image — GPT Image 2 (9 credits, supports 3:2 and 2:3)'
    endpoint: '/openapi/v1/text-to-image'
    method: POST
    request:
      headers:
        <<: *meshy-request-headers
      body:
        ai_model: 'gpt-image-2'
        prompt: '${prompt}'
        aspect_ratio: '1:1'
        generate_multi_view: false
        pose_mode: ''
        remove_background: false
    response:
      response_type: polling
      polling:
        <<: *meshy-t2i-polling
    parameters:
      - name: 'aspect_ratio'
        label: 'Aspect Ratio'
        description: 'Output image aspect ratio. Cannot be combined with Multi-View.'
        type: select
        # Same mutual exclusion as the nano-banana family; only the option
        # list differs (gpt-image-2 adds 3:2 and 2:3).
        conflicts_with: { generate_multi_view: true }
        allow_unset: true
        default: '1:1'
        options: ['1:1', '16:9', '9:16', '4:3', '3:4', '3:2', '2:3']
      - name: 'generate_multi_view'
        label: 'Multi-View'
        description: 'Generate 3 views of the subject instead of 1. Improves image-to-3D quality for some subjects. Turning this on clears Aspect Ratio.'
        type: boolean
        default: false
      - name: 'pose_mode'
        label: 'Pose'
        description: 'Force a standard character pose. Leave blank for automatic.'
        type: select
        default: ''
        options: ['', 'a-pose', 't-pose']
      - name: 'remove_background'
        label: 'Remove Background'
        description: 'Return the image as a transparent RGBA PNG with the background removed. Ideal for sprites and image-to-3D inputs.'
        type: boolean
        default: false

# =============================================================================
# Image-to-3D (v6 verified 2026-04-15, v7 verified 2026-08-10, t2 verified 2026-08-19; v6-lite / 7.1 / geometry_resolution per docs 2026-09-18)
# =============================================================================
image_to_3d:
  # --- Meshy v7 ---
  # Newest generation. Pinned to `meshy-7.1`, not `meshy-7`: Meshy deprecated
  # meshy-7 in favour of meshy-7.1, which has "the same parameters and credit
  # cost as meshy-7" with higher geometry detail. (Meshy's `latest` alias also
  # resolves to Meshy 7.1; we name the version explicitly so a future `latest`
  # rollover can't silently change what users pay for.)
  # Surface deltas vs v6:
  #   + geometry_resolution — "Requires meshy-7.1 or latest". Replaces the
  #     deprecated ultra_mode, which Meshy documents as equivalent:
  #     "ultra_mode: true is equivalent to geometry_resolution: '2k'".
  #   - remove_lighting — documented "supported only with meshy-6"
  #   - symmetry_mode   — deprecated API-wide, no longer advertised anywhere
  #     (it still rides along in the request body via the shared anchor, which
  #     is harmless: Meshy accepts and ignores it)
  # Note: v7 produces no emission map when enable_pbr is on (v6 does, except
  # at 8k textures).
  - id: 'meshy/v7/image-to-3d'
    name: 'Meshy v7'
    description: 'Meshy 7.1 — newest generation, supports high-resolution geometry'
    is_default: true
    endpoint: '/openapi/v1/image-to-3d'
    method: POST
    request:
      headers:
        <<: *meshy-request-headers
      body:
        <<: *meshy-i23d-body
        ai_model: 'meshy-7.1'
        # Meshy: should_remesh is "false (Meshy 6 and Meshy 7 models)".
        should_remesh: false
        # Values mirror Meshy's server-side defaults.
        texture_resolution: '2k'
        image_enhancement: true
        # meshy-7.1-only; supersedes the deprecated ultra_mode.
        geometry_resolution: 'standard'
    response:
      response_type: polling
      polling:
        <<: *meshy-i23d-polling
    parameters:
      - name: 'topology'
        label: 'Topology'
        description: 'Mesh topology. Quad is cleaner for hard-surface, triangle is default. Only applies when Remesh is on.'
        type: select
        default: 'triangle'
        options: ['triangle', 'quad']
      - name: 'target_polycount'
        label: 'Target Polycount'
        description: 'Target polygon count for the remesh pass. Has no effect unless Remesh is on, and is superseded by Adaptive Decimation.'
        type: integer
        widget: input
        # Meshy: setting decimation_mode means "target_polycount is ignored",
        # so once a tier is picked this key is dropped rather than sent to be
        # discarded server-side.
        conflicts_with: { decimation_mode: null }
        default: 30000
        min: 100
        max: 300000
      - name: 'should_remesh'
        label: 'Remesh'
        description: 'Decimate to Target Polycount and clean up topology for DCC tools. Off by default — turn on if you want Target Polycount to apply.'
        type: boolean
        default: false
      # Meshy: "Enable adaptive decimation by setting a polycount level.
      # When set, `target_polycount` is ignored." Levels are 1 (ultra),
      # 2 (high), 3 (medium), 4 (low). Documented as applying only during a
      # remesh pass on the standard models, so it is gated on should_remesh
      # and omitted from Smart Topology, which ignores should_remesh entirely.
      # Null default = unset, so nothing changes until you pick a level.
      - name: 'decimation_mode'
        label: 'Adaptive Decimation'
        description: 'Reduce the mesh to a polycount tier instead of an exact number: 1 = ultra, 2 = high, 3 = medium, 4 = low. Overrides Target Polycount. Needs Remesh on.'
        type: integer
        widget: input
        requires: { should_remesh: true }
        default: null
        min: 1
        max: 4
      - name: 'should_texture'
        label: 'Generate Textures'
        description: 'Generate texture maps. Disable for untextured geometry only.'
        type: boolean
        default: true
      - name: 'enable_pbr'
        label: 'PBR Materials'
        description: 'Generate metallic/roughness/normal maps. Ignored when Generate Textures is off. The in-app viewer renders flat textures more reliably; enable PBR if you plan to use the model in Blender/Unity/Unreal.'
        type: boolean
        default: false
      - name: 'pose_mode'
        label: 'Pose'
        description: 'Force a standard character pose. Leave blank for automatic.'
        type: select
        default: ''
        options: ['', 'a-pose', 't-pose']
      # --- meshy-7.1-only ---
      # Meshy: "2k runs the Ultra pass at 2048³; 4k at 4096³" and it
      # "Requires meshy-7.1 or latest". Supersedes ultra_mode, which Meshy
      # deprecated: "ultra_mode: true is equivalent to geometry_resolution: 2k".
      # fal's v7 wrapper only accepts standard/2k — see providers/fal-ai.yaml.
      - name: 'geometry_resolution'
        label: 'Geometry Resolution'
        description: 'Ultra pass tier for geometry detail. 2k runs the Ultra pass at 2048³; 4k at 4096³. Higher tiers cost more.'
        type: select
        default: 'standard'
        options: ['standard', '2k', '4k']
      # --- meshy-6-or-later production knobs ---
      - name: 'texture_resolution'
        label: 'Texture Resolution'
        description: 'Base color texture size. Higher resolutions capture more surface detail; 4K/8K cost more.'
        type: select
        default: '2k'
        options: ['2k', '4k', '8k']
      - name: 'image_enhancement'
        label: 'Enhance Input Image'
        description: 'Let Meshy pre-process the input image for better results. Turn off to preserve the original appearance exactly.'
        type: boolean
        default: true
      # Meshy: auto_size "uses AI vision to automatically estimate the
      # real-world height of the object and resize the model accordingly",
      # and origin_at is the "Position of the origin when auto_size is
      # enabled" — so the origin control only applies with sizing on.
      - name: 'auto_size'
        label: 'Auto Size'
        description: 'Estimate the object''s real-world height with AI vision and scale the model to match, instead of returning it at an arbitrary size.'
        type: boolean
        default: false
      - name: 'origin_at'
        label: 'Origin'
        description: 'Where the model''s origin sits once Auto Size has scaled it. Bottom is right for characters and props that stand on the ground.'
        type: select
        requires: { auto_size: true }
        default: 'bottom'
        options: ['bottom', 'center']
      - name: 'texture_prompt'
        label: 'Texture Prompt'
        description: 'Text guidance for texturing, separate from the generation prompt (max 800 characters). Ignored when Generate Textures is off.'
        type: string
        widget: input
        default: null

  # --- Meshy Smart Topology (meshy-t2) ---
  # Meshy's Smart Topology model (model_type: smart-topology): cleaner
  # topology, natively separated parts, triangle output, and a directly
  # settable face count via target_polycount — aimed at game-ready meshes
  # without a remesh pass. Meshy recommends it over the deprecated lowpoly
  # mode. Per Meshy's docs, topology / should_remesh /
  # save_pre_remeshed_model are IGNORED for smart-topology tasks, so this
  # block advertises none of them; the body sends only what applies.
  # (meshy-t1, the old low-poly model without settable face count, is
  # deliberately not offered.)
  #
  # This is also why `model_type` is not a tunable parameter anywhere: its
  # values select between the standard pipeline, smart-topology and the
  # deprecated lowpoly mode, and our catalog already models Smart Topology as
  # its own model id with the surface Meshy documents for it. A model_type
  # dropdown would be a second, worse way to pick a model.
  - id: 'meshy/t2/image-to-3d'
    name: 'Meshy Smart Topology'
    description: 'Meshy T2 — clean topology and separated parts, game-ready face counts'
    endpoint: '/openapi/v1/image-to-3d'
    method: POST
    request:
      headers:
        <<: *meshy-request-headers
      body:
        image_url: '${image_url}'
        model_type: 'smart-topology'
        ai_model: 'meshy-t2'
        target_polycount: 4000
        should_texture: true
        enable_pbr: false
        pose_mode: ''
        target_formats: ['glb']
        auto_size: false
        origin_at: 'bottom'
        # Null = unset: stripped from the request so Meshy applies its own
        # default unless the user supplies one.
        texture_prompt: null
    response:
      response_type: polling
      polling:
        <<: *meshy-i23d-polling
    parameters:
      - name: 'target_polycount'
        label: 'Target Polycount'
        description: 'Face count for the generated mesh — applies directly on Smart Topology, no remesh pass needed. Meshy documents the meshy-t2 range as 100 to 15,000, default 4,000.'
        type: integer
        widget: input
        default: 4000
        min: 100
        max: 15000
      - name: 'should_texture'
        label: 'Generate Textures'
        description: 'Generate texture maps. Disable for untextured geometry only.'
        type: boolean
        default: true
      - name: 'enable_pbr'
        label: 'PBR Materials'
        description: 'Generate metallic/roughness/normal maps. Ignored when Generate Textures is off. The in-app viewer renders flat textures more reliably; enable PBR if you plan to use the model in Blender/Unity/Unreal.'
        type: boolean
        default: false
      - name: 'pose_mode'
        label: 'Pose'
        description: 'Force a standard character pose. Leave blank for automatic.'
        type: select
        default: ''
        options: ['', 'a-pose', 't-pose']
      # Meshy: auto_size "uses AI vision to automatically estimate the
      # real-world height of the object and resize the model accordingly",
      # and origin_at is the "Position of the origin when auto_size is
      # enabled" — so the origin control only applies with sizing on.
      - name: 'auto_size'
        label: 'Auto Size'
        description: 'Estimate the object''s real-world height with AI vision and scale the model to match, instead of returning it at an arbitrary size.'
        type: boolean
        default: false
      - name: 'origin_at'
        label: 'Origin'
        description: 'Where the model''s origin sits once Auto Size has scaled it. Bottom is right for characters and props that stand on the ground.'
        type: select
        requires: { auto_size: true }
        default: 'bottom'
        options: ['bottom', 'center']
      - name: 'texture_prompt'
        label: 'Texture Prompt'
        description: 'Text guidance for texturing, separate from the generation prompt (max 800 characters). Ignored when Generate Textures is off.'
        type: string
        widget: input
        default: null

  # --- Meshy v6 ---
  # Production-grade 3D models with PBR textures, served directly by Meshy
  # without fal.ai's wrapper markup. Accepts either a public image URL or a
  # `data:image/png;base64,...` data URI (the pipeline auto-uses data URI when
  # the provider has no upload endpoint).
  - id: 'meshy/v6/image-to-3d'
    name: 'Meshy v6'
    description: 'Meshy 6 — production-ready 3D with PBR textures'
    endpoint: '/openapi/v1/image-to-3d'
    method: POST
    request:
      headers:
        <<: *meshy-request-headers
      body:
        <<: *meshy-i23d-body
        ai_model: 'meshy-6'
        # v6 defaults should_remesh=false (clean topology is native).
        should_remesh: false
        # meshy-6-or-later knobs (remove_lighting is v6-only); values mirror
        # Meshy's server-side defaults.
        texture_resolution: '2k'
        remove_lighting: true
        image_enhancement: true
    response:
      response_type: polling
      polling:
        <<: *meshy-i23d-polling
    parameters:
      - name: 'topology'
        label: 'Topology'
        description: 'Mesh topology. Quad is cleaner for hard-surface, triangle is default. Only applies when Remesh is on.'
        type: select
        default: 'triangle'
        options: ['triangle', 'quad']
      - name: 'target_polycount'
        label: 'Target Polycount'
        description: 'Target polygon count for the remesh pass. Has no effect unless Remesh is on, and is superseded by Adaptive Decimation.'
        type: integer
        widget: input
        # Meshy: setting decimation_mode means "target_polycount is ignored",
        # so once a tier is picked this key is dropped rather than sent to be
        # discarded server-side.
        conflicts_with: { decimation_mode: null }
        default: 30000
        min: 100
        max: 300000
      - name: 'should_remesh'
        label: 'Remesh'
        description: 'Decimate to Target Polycount and clean up topology for DCC tools. Off by default — turn on if you want Target Polycount to apply.'
        type: boolean
        default: false
      # Meshy: "Enable adaptive decimation by setting a polycount level.
      # When set, `target_polycount` is ignored." Levels are 1 (ultra),
      # 2 (high), 3 (medium), 4 (low). Documented as applying only during a
      # remesh pass on the standard models, so it is gated on should_remesh
      # and omitted from Smart Topology, which ignores should_remesh entirely.
      # Null default = unset, so nothing changes until you pick a level.
      - name: 'decimation_mode'
        label: 'Adaptive Decimation'
        description: 'Reduce the mesh to a polycount tier instead of an exact number: 1 = ultra, 2 = high, 3 = medium, 4 = low. Overrides Target Polycount. Needs Remesh on.'
        type: integer
        widget: input
        requires: { should_remesh: true }
        default: null
        min: 1
        max: 4
      - name: 'should_texture'
        label: 'Generate Textures'
        description: 'Generate texture maps. Disable for untextured geometry only.'
        type: boolean
        default: true
      - name: 'enable_pbr'
        label: 'PBR Materials'
        description: 'Generate metallic/roughness/normal maps. Ignored when Generate Textures is off. The in-app viewer renders flat textures more reliably; enable PBR if you plan to use the model in Blender/Unity/Unreal.'
        type: boolean
        default: false
      - name: 'pose_mode'
        label: 'Pose'
        description: 'Force a standard character pose. Leave blank for automatic.'
        type: select
        default: ''
        options: ['', 'a-pose', 't-pose']
      # --- meshy-6 production knobs ---
      # texture_resolution has no model gate of its own — Meshy's only
      # restriction is value-level: "The 4k and 8k options are unavailable
      # with meshy-6-lite", which is why v6-lite omits the dropdown rather
      # than offering 2k alone. image_enhancement is "only available with
      # meshy-6, meshy-7.1, or latest". remove_lighting is "supported only
      # with meshy-6", so neither v6-lite nor v7 exposes it. Defaults mirror
      # Meshy's server-side defaults exactly, so sending them changes nothing
      # until the user moves a control.
      - name: 'texture_resolution'
        label: 'Texture Resolution'
        description: 'Base color texture size. Higher resolutions capture more surface detail; 4K/8K cost more.'
        type: select
        default: '2k'
        options: ['2k', '4k', '8k']
      - name: 'remove_lighting'
        label: 'Remove Baked Lighting'
        description: 'Strip highlights and shadows from the base color texture so the model lights correctly under your own scene lighting. Usually what you want for game assets.'
        type: boolean
        default: true
      - name: 'image_enhancement'
        label: 'Enhance Input Image'
        description: 'Let Meshy pre-process the input image for better results. Turn off to preserve the original appearance exactly.'
        type: boolean
        default: true
      # Meshy: auto_size "uses AI vision to automatically estimate the
      # real-world height of the object and resize the model accordingly",
      # and origin_at is the "Position of the origin when auto_size is
      # enabled" — so the origin control only applies with sizing on.
      - name: 'auto_size'
        label: 'Auto Size'
        description: 'Estimate the object''s real-world height with AI vision and scale the model to match, instead of returning it at an arbitrary size.'
        type: boolean
        default: false
      - name: 'origin_at'
        label: 'Origin'
        description: 'Where the model''s origin sits once Auto Size has scaled it. Bottom is right for characters and props that stand on the ground.'
        type: select
        requires: { auto_size: true }
        default: 'bottom'
        options: ['bottom', 'center']
      # Not version-restricted — every image-to-3D model declares this one.
      # Null default so the key is omitted entirely unless the user sets it;
      # Meshy documents no empty-string sentinel for this field.
      - name: 'texture_prompt'
        label: 'Texture Prompt'
        description: 'Text guidance for texturing, separate from the generation prompt (max 800 characters). Ignored when Generate Textures is off.'
        type: string
        widget: input
        default: null

  # --- Meshy 6 Lite ---
  # Budget tier. Replaces meshy-5, which Meshy retired on 2026-09-16; Meshy
  # describes meshy-6-lite as the successor to meshy-5 with the same
  # parameters and the same credit cost, so this block keeps the old v5
  # surface verbatim.
  - id: 'meshy/v6-lite/image-to-3d'
    name: 'Meshy 6 Lite'
    description: 'Meshy 6 Lite — budget tier, lower credit cost'
    endpoint: '/openapi/v1/image-to-3d'
    method: POST
    request:
      headers:
        <<: *meshy-request-headers
      body:
        <<: *meshy-i23d-body
        ai_model: 'meshy-6-lite'
        # Meshy documents meshy-6-lite as the meshy-5 successor "with the
        # same parameters", so it keeps meshy-5's remesh default. Sent
        # explicitly, so the server-side default never applies.
        should_remesh: true
    response:
      response_type: polling
      polling:
        <<: *meshy-i23d-polling
    # NOTE: kept in sync with meshy-6 above except where Meshy's API differs.
    # Deltas: should_remesh's default (above), and the absence of
    # texture_resolution / remove_lighting / image_enhancement:
    #   - texture_resolution: "The 4k and 8k options are unavailable with
    #     meshy-6-lite" — a 2k-only dropdown has nothing to choose, so the
    #     knob is omitted and the body simply doesn't send it.
    #   - image_enhancement: "only available with meshy-6, meshy-7.1, or latest".
    #   - remove_lighting: "supported only with meshy-6".
    parameters:
      - name: 'topology'
        label: 'Topology'
        description: 'Mesh topology. Quad is cleaner for hard-surface, triangle is default. Only applies when Remesh is on.'
        type: select
        default: 'triangle'
        options: ['triangle', 'quad']
      - name: 'target_polycount'
        label: 'Target Polycount'
        description: 'Target polygon count for the remesh pass. Has no effect unless Remesh is on, and is superseded by Adaptive Decimation.'
        type: integer
        widget: input
        # Meshy: setting decimation_mode means "target_polycount is ignored",
        # so once a tier is picked this key is dropped rather than sent to be
        # discarded server-side.
        conflicts_with: { decimation_mode: null }
        default: 30000
        min: 100
        max: 300000
      - name: 'should_remesh'
        label: 'Remesh'
        description: 'Decimate to Target Polycount and clean up topology for DCC tools. Recommended.'
        type: boolean
        default: true
      # Meshy: "Enable adaptive decimation by setting a polycount level.
      # When set, `target_polycount` is ignored." Levels are 1 (ultra),
      # 2 (high), 3 (medium), 4 (low). Documented as applying only during a
      # remesh pass on the standard models, so it is gated on should_remesh
      # and omitted from Smart Topology, which ignores should_remesh entirely.
      # Null default = unset, so nothing changes until you pick a level.
      - name: 'decimation_mode'
        label: 'Adaptive Decimation'
        description: 'Reduce the mesh to a polycount tier instead of an exact number: 1 = ultra, 2 = high, 3 = medium, 4 = low. Overrides Target Polycount. Needs Remesh on.'
        type: integer
        widget: input
        requires: { should_remesh: true }
        default: null
        min: 1
        max: 4
      - name: 'should_texture'
        label: 'Generate Textures'
        description: 'Generate texture maps. Disable for untextured geometry only.'
        type: boolean
        default: true
      - name: 'enable_pbr'
        label: 'PBR Materials'
        description: 'Generate metallic/roughness/normal maps. Ignored when Generate Textures is off. The in-app viewer renders flat textures more reliably; enable PBR if you plan to use the model in Blender/Unity/Unreal.'
        type: boolean
        default: false
      - name: 'pose_mode'
        label: 'Pose'
        description: 'Force a standard character pose. Leave blank for automatic.'
        type: select
        default: ''
        options: ['', 'a-pose', 't-pose']
      # Meshy: auto_size "uses AI vision to automatically estimate the
      # real-world height of the object and resize the model accordingly",
      # and origin_at is the "Position of the origin when auto_size is
      # enabled" — so the origin control only applies with sizing on.
      - name: 'auto_size'
        label: 'Auto Size'
        description: 'Estimate the object''s real-world height with AI vision and scale the model to match, instead of returning it at an arbitrary size.'
        type: boolean
        default: false
      - name: 'origin_at'
        label: 'Origin'
        description: 'Where the model''s origin sits once Auto Size has scaled it. Bottom is right for characters and props that stand on the ground.'
        type: select
        requires: { auto_size: true }
        default: 'bottom'
        options: ['bottom', 'center']
      - name: 'texture_prompt'
        label: 'Texture Prompt'
        description: 'Text guidance for texturing, separate from the generation prompt (max 800 characters). Ignored when Generate Textures is off.'
        type: string
        widget: input
        default: null
