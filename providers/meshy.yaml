# Meshy AI Provider Configuration
# Native Meshy API — text-to-image and image-to-3D
# Exists so users can run the full pipeline with only a Meshy key
# (no fal.ai key required).

# YAML anchors for reusable configuration blocks
x-meshy-auth: &meshy-auth
  Authorization: 'Bearer ${MESHY_API_KEY}'

x-meshy-request-headers: &meshy-request-headers
  <<: *meshy-auth
  Content-Type: 'application/json'

# Meshy returns {"result": "<task-id>"} on task creation and requires polling a
# separate URL built from the task id. status_url_template does that substitution.
x-meshy-t2i-polling: &meshy-t2i-polling
  status_field: 'result'
  status_url_template: '/openapi/v1/text-to-image/${result}'
  status_check_field: 'status'
  success_value: 'SUCCEEDED'
  failure_value: 'FAILED'
  result_field: 'image_urls[0]'
  interval_ms: 1500
  max_attempts: 120
  # Meshy cancels via DELETE on the same task URL (no URL rewrite needed).
  cancel_url_template: '${status_url}'
  cancel_method: DELETE

x-meshy-i23d-polling: &meshy-i23d-polling
  status_field: 'result'
  status_url_template: '/openapi/v1/image-to-3d/${result}'
  status_check_field: 'status'
  success_value: 'SUCCEEDED'
  failure_value: 'FAILED'
  result_field: 'model_urls.glb'
  interval_ms: 2000
  max_attempts: 300
  cancel_url_template: '${status_url}'
  cancel_method: DELETE

# Shared parameter lists. YAML anchor+alias replaces the whole list, which is
# exactly what we want here — every model in a family exposes the same knobs.
#
# aspect_ratio options are NOT shared across the whole provider: the
# nano-banana family takes one set and gpt-image-2 takes a different one
# (see its own block below). Only reuse this anchor for nano-banana models.
x-meshy-t2i-params: &meshy-t2i-params
  - name: 'aspect_ratio'
    label: 'Aspect Ratio'
    # Meshy rejects the request if aspect_ratio is sent alongside
    # generate_multi_view=true — it is not merely ignored. Clear it with
    # `--param aspect_ratio=` (or an empty GUI field) when enabling Multi-View.
    description: 'Output image aspect ratio. Cannot be combined with Multi-View — clear this field when Multi-View is on.'
    type: select
    # Mutually exclusive with generate_multi_view, so the user needs a way to
    # clear it: GUI dropdowns get an "(unset)" entry, CLI uses `--param aspect_ratio=`.
    allow_unset: true
    default: '1:1'
    options: ['1:1', '16:9', '9:16', '4:3', '3:4']
  - name: 'generate_multi_view'
    label: 'Multi-View'
    description: 'Generate 3 views of the subject instead of 1. Improves image-to-3D quality for some subjects. Requires Aspect Ratio to be cleared.'
    type: boolean
    default: false
  - name: 'pose_mode'
    label: 'Pose'
    description: 'Force a standard character pose. Leave blank for automatic.'
    type: select
    default: ''
    options: ['', 'a-pose', 't-pose']
  - name: 'remove_background'
    label: 'Remove Background'
    description: 'Return the image as a transparent RGBA PNG with the background removed. Ideal for sprites and image-to-3D inputs.'
    type: boolean
    default: false

# NOTE: YAML sequences can't be extended via merge keys, so the image-to-3D
# parameter lists below (under `parameters:` in each model block) are
# intentionally duplicated. Keep them in sync except for these deltas, which
# `meshy_v6_parameter_surface_matches_across_providers` enforces:
#   - should_remesh default: false on meshy-6/meshy-7 (native clean topology),
#                            true on meshy-5 (needs the remesh pass).
#   - texture_resolution / image_enhancement are meshy-6-or-later only per
#     Meshy's docs, so v5 omits them entirely.
#   - remove_lighting is documented "Only supported when ai_model is meshy-6",
#     so v6 alone exposes it.
#   - ultra_mode is documented "Only supported when ai_model is meshy-7 (or
#     latest)", so v7 alone exposes it.
#   - symmetry_mode is deprecated API-wide ("no longer affects output"). It
#     stays on v5/v6 for continuity but is NOT advertised on v7 — don't add
#     dead knobs to new models.
# The surfaces are also aligned with fal's wrappers (fal-ai/meshy/v6/
# image-to-3d and, since 2026-08, meshy/v7/image-to-3d under fal's partner
# namespace) so users see the same knobs regardless of which provider serves
# the model — minus the native-only params each fal wrapper doesn't expose:
# v6's wrapper lacks texture_resolution/remove_lighting/image_enhancement/
# texture_prompt; v7's wrapper passes texture_prompt through but still lacks
# texture_resolution/image_enhancement.

# Shared image-to-3D request body. Per-version overrides (e.g. should_remesh)
# go on each model block below.
x-meshy-i23d-body: &meshy-i23d-body
  image_url: '${image_url}'
  topology: 'triangle'
  target_polycount: 30000
  enable_pbr: false
  should_texture: true
  symmetry_mode: 'auto'
  pose_mode: ''
  target_formats: ['glb']
  # Null = unset: stripped from the request so Meshy applies its own default
  # unless the user supplies one.
  texture_prompt: null

provider:
  id: 'meshy'
  name: 'Meshy AI'
  description: 'Native Meshy API — text-to-image and production-grade image-to-3D'
  env_vars:
    - 'MESHY_API_KEY'
  base_url: 'https://api.meshy.ai'
  auth_format: 'Bearer ${MESHY_API_KEY}'
  api_key_url: 'https://www.meshy.ai/settings/api'
  website_url: 'https://www.meshy.ai'
  docs_url: 'https://docs.meshy.ai/en/api/quick-start'
  # Meshy has no file upload endpoint — image-to-3D accepts inline
  # `data:image/png;base64,...` URIs directly. The pipeline falls back to
  # data-URI encoding automatically when `upload` is absent.

# =============================================================================
# Text-to-Image (verified 2026-04-15)
# =============================================================================
text_to_image:
  # --- Nano Banana ---
  # Meshy's standard text-to-image model. Shares naming with fal's nano-banana;
  # Meshy does not publicly document the underlying architecture.
  - id: 'meshy/nano-banana'
    name: 'Nano Banana'
    description: 'Meshy text-to-image — standard quality'
    is_default: true
    endpoint: '/openapi/v1/text-to-image'
    method: POST
    request:
      headers:
        <<: *meshy-request-headers
      body:
        ai_model: 'nano-banana'
        prompt: '${prompt}'
        aspect_ratio: '1:1'
        generate_multi_view: false
        pose_mode: ''
        remove_background: false
    response:
      response_type: polling
      polling:
        <<: *meshy-t2i-polling
    parameters: *meshy-t2i-params

  # --- Nano Banana 2 ---
  # Mid tier: 6 credits/image vs 3 for nano-banana, 9 for pro.
  - id: 'meshy/nano-banana-2'
    name: 'Nano Banana 2'
    description: 'Meshy text-to-image — mid tier (6 credits)'
    endpoint: '/openapi/v1/text-to-image'
    method: POST
    request:
      headers:
        <<: *meshy-request-headers
      body:
        ai_model: 'nano-banana-2'
        prompt: '${prompt}'
        aspect_ratio: '1:1'
        generate_multi_view: false
        pose_mode: ''
        remove_background: false
    response:
      response_type: polling
      polling:
        <<: *meshy-t2i-polling
    parameters: *meshy-t2i-params

  # --- Nano Banana Pro ---
  # Higher quality tier with the same parameter surface.
  - id: 'meshy/nano-banana-pro'
    name: 'Nano Banana Pro'
    description: 'Meshy text-to-image — higher quality (9 credits)'
    endpoint: '/openapi/v1/text-to-image'
    method: POST
    request:
      headers:
        <<: *meshy-request-headers
      body:
        ai_model: 'nano-banana-pro'
        prompt: '${prompt}'
        aspect_ratio: '1:1'
        generate_multi_view: false
        pose_mode: ''
        remove_background: false
    response:
      response_type: polling
      polling:
        <<: *meshy-t2i-polling
    parameters: *meshy-t2i-params

  # --- GPT Image 2 ---
  # Different architecture, and crucially a DIFFERENT aspect-ratio set:
  # 1:1 / 3:2 / 2:3 only. It cannot reuse *meshy-t2i-params — doing so would
  # advertise 16:9, 9:16, 4:3 and 3:4, which this model rejects. It is also the
  # only Meshy text-to-image model that offers 2:3, the common tall-sprite ratio.
  - id: 'meshy/gpt-image-2'
    name: 'GPT Image 2'
    description: 'Meshy text-to-image — GPT Image 2 (9 credits, supports 2:3)'
    endpoint: '/openapi/v1/text-to-image'
    method: POST
    request:
      headers:
        <<: *meshy-request-headers
      body:
        ai_model: 'gpt-image-2'
        prompt: '${prompt}'
        aspect_ratio: '1:1'
        generate_multi_view: false
        pose_mode: ''
        remove_background: false
    response:
      response_type: polling
      polling:
        <<: *meshy-t2i-polling
    parameters:
      - name: 'aspect_ratio'
        label: 'Aspect Ratio'
        description: 'Output image aspect ratio. Cannot be combined with Multi-View — clear this field when Multi-View is on.'
        type: select
        allow_unset: true
        default: '1:1'
        options: ['1:1', '3:2', '2:3']
      - name: 'generate_multi_view'
        label: 'Multi-View'
        description: 'Generate 3 views of the subject instead of 1. Improves image-to-3D quality for some subjects. Requires Aspect Ratio to be cleared.'
        type: boolean
        default: false
      - name: 'pose_mode'
        label: 'Pose'
        description: 'Force a standard character pose. Leave blank for automatic.'
        type: select
        default: ''
        options: ['', 'a-pose', 't-pose']
      - name: 'remove_background'
        label: 'Remove Background'
        description: 'Return the image as a transparent RGBA PNG with the background removed. Ideal for sprites and image-to-3D inputs.'
        type: boolean
        default: false

# =============================================================================
# Image-to-3D (v5/v6 verified 2026-04-15, v7 verified 2026-08-10)
# =============================================================================
image_to_3d:
  # --- Meshy v7 ---
  # Newest generation (Meshy's `latest` alias resolves to meshy-7). Same task
  # API as v6; the surface deltas vs v6 are:
  #   + ultra_mode      — v7-only, higher-fidelity geometry
  #   - remove_lighting — documented "Only supported when ai_model is meshy-6"
  #   - symmetry_mode   — deprecated API-wide, not advertised on new models
  #     (it still rides along in the request body via the shared anchor, which
  #     is harmless: Meshy accepts and ignores it)
  # Note: v7 produces no emission map when enable_pbr is on (v6 does, except
  # at 8k textures).
  - id: 'meshy/v7/image-to-3d'
    name: 'Meshy v7'
    description: 'Meshy 7 — newest generation, supports Ultra mode'
    is_default: true
    endpoint: '/openapi/v1/image-to-3d'
    method: POST
    request:
      headers:
        <<: *meshy-request-headers
      body:
        <<: *meshy-i23d-body
        ai_model: 'meshy-7'
        # v7 defaults should_remesh=false (clean topology is native).
        should_remesh: false
        # meshy-6-or-later knobs; values mirror Meshy's server-side defaults.
        texture_resolution: '2k'
        image_enhancement: true
        # v7-only.
        ultra_mode: false
    response:
      response_type: polling
      polling:
        <<: *meshy-i23d-polling
    parameters:
      - name: 'topology'
        label: 'Topology'
        description: 'Mesh topology. Quad is cleaner for hard-surface, triangle is default. Only applies when Remesh is on.'
        type: select
        default: 'triangle'
        options: ['triangle', 'quad']
      - name: 'target_polycount'
        label: 'Target Polycount'
        description: 'Target polygon count for the remesh pass. Has no effect unless Remesh is on.'
        type: integer
        widget: input
        default: 30000
        min: 100
        max: 300000
      - name: 'should_remesh'
        label: 'Remesh'
        description: 'Decimate to Target Polycount and clean up topology for DCC tools. Off by default — turn on if you want Target Polycount to apply.'
        type: boolean
        default: false
      - name: 'should_texture'
        label: 'Generate Textures'
        description: 'Generate texture maps. Disable for untextured geometry only.'
        type: boolean
        default: true
      - name: 'enable_pbr'
        label: 'PBR Materials'
        description: 'Generate metallic/roughness/normal maps. Ignored when Generate Textures is off. The in-app viewer renders flat textures more reliably; enable PBR if you plan to use the model in Blender/Unity/Unreal.'
        type: boolean
        default: false
      - name: 'pose_mode'
        label: 'Pose'
        description: 'Force a standard character pose. Leave blank for automatic.'
        type: select
        default: ''
        options: ['', 'a-pose', 't-pose']
      # --- v7-only ---
      - name: 'ultra_mode'
        label: 'Ultra Mode'
        description: 'Ultra generation — higher-fidelity geometry with finer surface detail.'
        type: boolean
        default: false
      # --- meshy-6-or-later production knobs ---
      - name: 'texture_resolution'
        label: 'Texture Resolution'
        description: 'Base color texture size. Higher resolutions capture more surface detail; 4K/8K cost more.'
        type: select
        default: '2k'
        options: ['2k', '4k', '8k']
      - name: 'image_enhancement'
        label: 'Enhance Input Image'
        description: 'Let Meshy pre-process the input image for better results. Turn off to preserve the original appearance exactly.'
        type: boolean
        default: true
      - name: 'texture_prompt'
        label: 'Texture Prompt'
        description: 'Text guidance for texturing, separate from the generation prompt (max 600 characters). Ignored when Generate Textures is off.'
        type: string
        widget: input
        default: null

  # --- Meshy Smart Topology (meshy-t2) ---
  # Meshy's Smart Topology model (model_type: smart-topology): cleaner
  # topology, natively separated parts, triangle output, and a directly
  # settable face count via target_polycount — aimed at game-ready meshes
  # without a remesh pass. Meshy recommends it over the deprecated lowpoly
  # mode. Per Meshy's docs, topology / should_remesh /
  # save_pre_remeshed_model are IGNORED for smart-topology tasks, so this
  # block advertises none of them; the body sends only what applies.
  # (meshy-t1, the old low-poly model without settable face count, is
  # deliberately not offered.)
  - id: 'meshy/t2/image-to-3d'
    name: 'Meshy Smart Topology'
    description: 'Meshy T2 — clean topology and separated parts, game-ready face counts'
    endpoint: '/openapi/v1/image-to-3d'
    method: POST
    request:
      headers:
        <<: *meshy-request-headers
      body:
        image_url: '${image_url}'
        model_type: 'smart-topology'
        ai_model: 'meshy-t2'
        target_polycount: 4000
        should_texture: true
        enable_pbr: false
        pose_mode: ''
        target_formats: ['glb']
        # Null = unset: stripped from the request so Meshy applies its own
        # default unless the user supplies one.
        texture_prompt: null
    response:
      response_type: polling
      polling:
        <<: *meshy-i23d-polling
    parameters:
      - name: 'target_polycount'
        label: 'Target Polycount'
        description: 'Face count for the generated mesh — applies directly on Smart Topology, no remesh pass needed. Capped at 15,000 for meshy-t2 (per the API changelog; the parameter page does not state it — verified live).'
        type: integer
        widget: input
        default: 4000
        min: 100
        max: 15000
      - name: 'should_texture'
        label: 'Generate Textures'
        description: 'Generate texture maps. Disable for untextured geometry only.'
        type: boolean
        default: true
      - name: 'enable_pbr'
        label: 'PBR Materials'
        description: 'Generate metallic/roughness/normal maps. Ignored when Generate Textures is off. The in-app viewer renders flat textures more reliably; enable PBR if you plan to use the model in Blender/Unity/Unreal.'
        type: boolean
        default: false
      - name: 'pose_mode'
        label: 'Pose'
        description: 'Force a standard character pose. Leave blank for automatic.'
        type: select
        default: ''
        options: ['', 'a-pose', 't-pose']
      - name: 'texture_prompt'
        label: 'Texture Prompt'
        description: 'Text guidance for texturing, separate from the generation prompt (max 600 characters). Ignored when Generate Textures is off.'
        type: string
        widget: input
        default: null

  # --- Meshy v6 ---
  # Production-grade 3D models with PBR textures, served directly by Meshy
  # without fal.ai's wrapper markup. Accepts either a public image URL or a
  # `data:image/png;base64,...` data URI (the pipeline auto-uses data URI when
  # the provider has no upload endpoint).
  - id: 'meshy/v6/image-to-3d'
    name: 'Meshy v6'
    description: 'Meshy 6 — production-ready 3D with PBR textures'
    endpoint: '/openapi/v1/image-to-3d'
    method: POST
    request:
      headers:
        <<: *meshy-request-headers
      body:
        <<: *meshy-i23d-body
        ai_model: 'meshy-6'
        # v6 defaults should_remesh=false (clean topology is native).
        should_remesh: false
        # meshy-6-or-later knobs (remove_lighting is v6-only); values mirror
        # Meshy's server-side defaults.
        texture_resolution: '2k'
        remove_lighting: true
        image_enhancement: true
    response:
      response_type: polling
      polling:
        <<: *meshy-i23d-polling
    parameters:
      - name: 'topology'
        label: 'Topology'
        description: 'Mesh topology. Quad is cleaner for hard-surface, triangle is default. Only applies when Remesh is on.'
        type: select
        default: 'triangle'
        options: ['triangle', 'quad']
      - name: 'target_polycount'
        label: 'Target Polycount'
        description: 'Target polygon count for the remesh pass. Has no effect unless Remesh is on.'
        type: integer
        widget: input
        default: 30000
        min: 100
        max: 300000
      - name: 'should_remesh'
        label: 'Remesh'
        description: 'Decimate to Target Polycount and clean up topology for DCC tools. Off by default — turn on if you want Target Polycount to apply.'
        type: boolean
        default: false
      - name: 'should_texture'
        label: 'Generate Textures'
        description: 'Generate texture maps. Disable for untextured geometry only.'
        type: boolean
        default: true
      - name: 'enable_pbr'
        label: 'PBR Materials'
        description: 'Generate metallic/roughness/normal maps. Ignored when Generate Textures is off. The in-app viewer renders flat textures more reliably; enable PBR if you plan to use the model in Blender/Unity/Unreal.'
        type: boolean
        default: false
      - name: 'symmetry_mode'
        label: 'Symmetry'
        description: 'Controls symmetry during generation.'
        type: select
        default: 'auto'
        options: ['off', 'auto', 'on']
      - name: 'pose_mode'
        label: 'Pose'
        description: 'Force a standard character pose. Leave blank for automatic.'
        type: select
        default: ''
        options: ['', 'a-pose', 't-pose']
      # --- meshy-6+ production knobs ---
      # texture_resolution and image_enhancement are meshy-6-or-later (4k/8k
      # textures unavailable on meshy-5); remove_lighting is documented as
      # meshy-6 ONLY, so neither v5 nor v7 exposes it. Defaults mirror Meshy's
      # server-side defaults exactly, so sending them changes nothing until
      # the user moves a control.
      - name: 'texture_resolution'
        label: 'Texture Resolution'
        description: 'Base color texture size. 4K/8K cost more and are unavailable on Meshy v5.'
        type: select
        default: '2k'
        options: ['2k', '4k', '8k']
      - name: 'remove_lighting'
        label: 'Remove Baked Lighting'
        description: 'Strip highlights and shadows from the base color texture so the model lights correctly under your own scene lighting. Usually what you want for game assets.'
        type: boolean
        default: true
      - name: 'image_enhancement'
        label: 'Enhance Input Image'
        description: 'Let Meshy pre-process the input image for better results. Turn off to preserve the original appearance exactly.'
        type: boolean
        default: true
      # Not version-restricted — v5 declares this one too.
      # Null default so the key is omitted entirely unless the user sets it;
      # Meshy documents no empty-string sentinel for this field.
      - name: 'texture_prompt'
        label: 'Texture Prompt'
        description: 'Text guidance for texturing, separate from the generation prompt (max 600 characters). Ignored when Generate Textures is off.'
        type: string
        widget: input
        default: null

  # --- Meshy v5 ---
  # Previous-generation model — roughly 4× cheaper on mesh generation
  # (5 credits vs 20) and 2× cheaper fully textured (15 vs 30). Use this to
  # stretch a Meshy subscription's credit pool for drafts or bulk work.
  - id: 'meshy/v5/image-to-3d'
    name: 'Meshy v5'
    description: 'Meshy 5 — previous generation, lower credit cost'
    endpoint: '/openapi/v1/image-to-3d'
    method: POST
    request:
      headers:
        <<: *meshy-request-headers
      body:
        <<: *meshy-i23d-body
        ai_model: 'meshy-5'
        # v5 defaults should_remesh=true (needs the remesh pass for clean topology).
        should_remesh: true
    response:
      response_type: polling
      polling:
        <<: *meshy-i23d-polling
    # NOTE: kept in sync with meshy-6 above except where Meshy's API differs.
    # Deltas: should_remesh's default, and the absence of texture_resolution /
    # remove_lighting / image_enhancement, which Meshy documents as
    # meshy-6-or-latest only. Advertising them here would offer knobs this
    # model rejects.
    parameters:
      - name: 'topology'
        label: 'Topology'
        description: 'Mesh topology. Quad is cleaner for hard-surface, triangle is default. Only applies when Remesh is on.'
        type: select
        default: 'triangle'
        options: ['triangle', 'quad']
      - name: 'target_polycount'
        label: 'Target Polycount'
        description: 'Target polygon count for the remesh pass. Has no effect unless Remesh is on.'
        type: integer
        widget: input
        default: 30000
        min: 100
        max: 300000
      - name: 'should_remesh'
        label: 'Remesh'
        description: 'Decimate to Target Polycount and clean up topology for DCC tools. Recommended.'
        type: boolean
        default: true
      - name: 'should_texture'
        label: 'Generate Textures'
        description: 'Generate texture maps. Disable for untextured geometry only.'
        type: boolean
        default: true
      - name: 'enable_pbr'
        label: 'PBR Materials'
        description: 'Generate metallic/roughness/normal maps. Ignored when Generate Textures is off. The in-app viewer renders flat textures more reliably; enable PBR if you plan to use the model in Blender/Unity/Unreal.'
        type: boolean
        default: false
      - name: 'symmetry_mode'
        label: 'Symmetry'
        description: 'Controls symmetry during generation.'
        type: select
        default: 'auto'
        options: ['off', 'auto', 'on']
      - name: 'pose_mode'
        label: 'Pose'
        description: 'Force a standard character pose. Leave blank for automatic.'
        type: select
        default: ''
        options: ['', 'a-pose', 't-pose']
      - name: 'texture_prompt'
        label: 'Texture Prompt'
        description: 'Text guidance for texturing, separate from the generation prompt (max 600 characters). Ignored when Generate Textures is off.'
        type: string
        widget: input
        default: null
