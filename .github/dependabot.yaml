version: 2

updates:
  # ─── Cargo dependencies (workspace root handles all members) ────────
  - package-ecosystem: 'cargo'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'sunday'
      time: '12:00'
      timezone: 'America/Chicago'
    versioning-strategy: lockfile-only
    open-pull-requests-limit: 10
    ignore:
      # ── 3D rendering stack: pinned for compatibility (see CLAUDE.md §10) ──
      # three-d git pin (da7cef6c5e17) requires glow 0.16 / egui 0.33.
      # egui 0.34 needs glow 0.17, but three-d has no glow 0.17 support yet.
      # All of these must be upgraded together manually when three-d publishes
      # a new release. See CLAUDE.md "Next upgrade path" for the full plan.
      - dependency-name: 'three-d'
      - dependency-name: 'three-d-asset'
      - dependency-name: 'egui'
      - dependency-name: 'eframe'
      - dependency-name: 'egui_extras'
      - dependency-name: 'egui-phosphor'
      - dependency-name: 'glow'
    groups:
      # Single group for all minor+patch updates
      rust-dependencies:
        patterns:
          - '*'
        update-types: ['minor', 'patch']
      # Security updates bypass version-update groups unless they have their
      # own group — without this they arrive as individual PRs.
      rust-security:
        applies-to: security-updates
        patterns:
          - '*'

  # ─── GitHub Actions ─────────────────────────────────────────────────
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
      time: '12:00'
      timezone: 'America/Chicago'
    ignore:
      # Compiler version lives in rust-toolchain.toml. CI installs it via
      # dtolnay/rust-toolchain@master + an explicit toolchain input, so
      # Dependabot must not treat action @tags as rustc upgrades.
      - dependency-name: 'dtolnay/rust-toolchain'
      # The action tag tracks Zola versions and must move in LOCKSTEP with
      # ZOLA_VERSION in the Makefile and the zola@ pin in site.yaml (all
      # three bumped together, by hand). A solo bump here desyncs local
      # builds from the deploy.
      - dependency-name: 'shalzz/zola-deploy-action'
    groups:
      # No update-types filter: action majors (checkout v6→v7 etc.) are
      # routine and belong in the weekly group, not individual PRs.
      actions:
        patterns:
          - '*'
