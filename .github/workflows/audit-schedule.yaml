name: Scheduled Audit

# New advisories land on their own schedule; the push-time audit only runs
# when Cargo.lock changes. This daily run catches advisories against an
# unchanged lockfile so they surface as their own signal instead of
# redlining unrelated PRs (the 2026-08-20 h2/RUSTSEC-2026-0258 lesson).
on:
  schedule:
    - cron: '41 9 * * *'
  workflow_dispatch:

jobs:
  audit:
    name: Security Audit (scheduled)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2.87.32
        with:
          tool: cargo-audit
      - run: make audit
