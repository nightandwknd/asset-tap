name: Site

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, closed]
    paths:
      - 'site/**'
      - '.github/workflows/site.yaml'

  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/site.yaml'

permissions:
  contents: write
  pull-requests: write

jobs:
  # PR: build preview + auto-cleanup on close
  preview:
    name: Preview
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Install Zola
        if: github.event.action != 'closed'
        uses: taiki-e/install-action@v2
        with:
          # Keep in sync with ZOLA_VERSION in the Makefile and the
          # zola-deploy-action version in `publish` below.
          tool: zola@0.23.4
      - name: Build site
        if: github.event.action != 'closed'
        run: cd site && zola build --base-url "/pr-preview/pr-${{ github.event.number }}"
      - uses: rossjrw/pr-preview-action@v1
        with:
          source-dir: site/public

  # Merge: build and push to gh-pages (GitHub Pages deploys automatically)
  publish:
    name: Publish
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Build and push to gh-pages
        # Keep in sync with ZOLA_VERSION in the Makefile (the action tag
        # tracks the zola version it bundles).
        uses: shalzz/zola-deploy-action@v0.23.4
        env:
          BUILD_DIR: site
          PAGES_BRANCH: gh-pages
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
