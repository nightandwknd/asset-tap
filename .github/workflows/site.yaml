name: Site

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, closed]
    paths:
      - 'site/**'
      - '.github/workflows/site.yaml'

  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/site.yaml'

permissions:
  contents: write
  pull-requests: write

# One gh-pages writer at a time: on merge, the preview-removal run and the
# publish run both push the branch; unserialized, the loser lands on a
# stale ref and its Pages build shows up as a failed deployment.
concurrency:
  group: site-gh-pages
  cancel-in-progress: false

jobs:
  # PR: build preview + auto-cleanup on close
  preview:
    name: Preview
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Install Zola
        if: github.event.action != 'closed'
        uses: taiki-e/install-action@v2
        with:
          # Keep in sync with ZOLA_VERSION in the Makefile and the
          # Install Zola step in `publish` below.
          tool: zola@0.23.4
      - name: Build site
        if: github.event.action != 'closed'
        run: cd site && zola build --base-url "/pr-preview/pr-${{ github.event.number }}"
      - uses: rossjrw/pr-preview-action@v1
        with:
          source-dir: site/public

  # Merge: build and push to gh-pages (GitHub Pages deploys automatically).
  # NOT the zola-deploy-action: it force-pushes gh-pages, which wiped live
  # PR previews on every publish and made the preview-removal pushes fail
  # against the rewritten ref. This deploy keeps pr-preview/ intact and
  # pushes without force.
  publish:
    name: Publish
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Install Zola
        uses: taiki-e/install-action@v2
        with:
          # Keep in sync with ZOLA_VERSION in the Makefile and the
          # Install Zola step in `preview` above.
          tool: zola@0.23.4
      - name: Build site
        run: cd site && zola build
      - name: Deploy to gh-pages, preserving PR previews
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: site/public
          branch: gh-pages
          clean: true
          clean-exclude: pr-preview
          force: false
