name: Site

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, closed]
    paths:
      - 'site/**'
      - '.github/workflows/site.yaml'

  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/site.yaml'

permissions:
  contents: write
  pull-requests: write

# One gh-pages writer at a time. Preview updates and publish must not
# interleave; GitHub Pages also cancels an in-progress build when a second
# commit lands, which is why merge used to mark every 🚀 publish as failed.
concurrency:
  group: site-gh-pages
  cancel-in-progress: false

jobs:
  # PR: build preview, or remove it when the PR is closed without merging.
  # A merge skips this job — publish drops that preview in the same commit
  # so Pages only builds once.
  preview:
    name: Preview
    if: github.event_name == 'pull_request' && (github.event.action != 'closed' || github.event.pull_request.merged == false)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Install Zola
        if: github.event.action != 'closed'
        uses: taiki-e/install-action@v2
        with:
          # Keep in sync with ZOLA_VERSION in the Makefile and the
          # Install Zola step in `publish` below.
          tool: zola@0.23.4
      - name: Check token mirror
        if: github.event.action != 'closed'
        run: ./scripts/check-tokens-mirror.sh
      - name: Build site
        if: github.event.action != 'closed'
        run: cd site && zola build --base-url "/pr-preview/pr-${{ github.event.number }}"
      - uses: rossjrw/pr-preview-action@v1
        with:
          source-dir: site/public

  # Merge: one push to gh-pages (GitHub Pages deploys automatically).
  # NOT the zola-deploy-action: it force-pushes gh-pages, which wiped live
  # PR previews on every publish. Open previews are copied into this commit
  # and closed ones dropped, so we do not need a second cleanup push.
  publish:
    name: Publish
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Install Zola
        uses: taiki-e/install-action@v2
        with:
          # Keep in sync with ZOLA_VERSION in the Makefile and the
          # Install Zola step in `preview` above.
          tool: zola@0.23.4
      - name: Check token mirror
        run: ./scripts/check-tokens-mirror.sh
      - name: Build site
        run: cd site && zola build
      - name: Keep open PR previews
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # No gh-pages yet (first publish): nothing to keep.
          git fetch origin gh-pages --depth=1 2>/dev/null || exit 0
          git checkout origin/gh-pages -- pr-preview 2>/dev/null || true
          if [ -d pr-preview ]; then
            mkdir -p site/public
            mv pr-preview site/public/pr-preview
            for dir in site/public/pr-preview/pr-*; do
              [ -d "$dir" ] || continue
              n="${dir##*/pr-}"
              # gh failing (rate limit, outage) is not "closed": keep the preview.
              state=$(gh pr view "$n" --json state --jq .state 2>/dev/null) || continue
              if [ "$state" != "OPEN" ]; then
                rm -rf "$dir"
              fi
            done
          fi
      - name: Deploy to gh-pages, preserving open PR previews
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: site/public
          branch: gh-pages
          clean: true
          force: false
