id: 'humanoid'
name: 'Humanoid Character'
description: 'T-pose the auto-fit can read: separated limbs, hands the widest points.'
category: 'character'
template: 'A full-body character reference, front view, square frame: ${description}. Strict T-pose: arms straight out at shoulder height, elbows locked, palms down, fingers slightly apart. Fingertips are the widest points and the top of the head is the highest; the figure fills the frame fingertip-to-fingertip and head-to-feet. Clear space between each arm and the torso, and a clear gap between the legs. Legs straight, feet flat and forward at shoulder width. Clothing, hair, coats, and capes follow the body and leave those gaps open. Weapons and gear stay against the body or on the back, below the head and inside the arm span. One complete figure, centered, even lighting, no cast shadows, plain flat background.'
variables:
  - name: 'description'
    description: 'Character description (style, clothing, features)'
    required: true
examples:
  - 'a cowboy ninja in a fitted leather jacket, bandana mask, and dual katanas on the back'
  - 'a steampunk robot knight with brass armor and glowing eyes'
  - 'a muscular orc warrior with green skin and tribal tattoos'
  - 'a sleek android with white chassis and orange accents'
