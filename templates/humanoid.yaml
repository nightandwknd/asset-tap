id: 'humanoid'
name: 'Humanoid Character'
description: 'T-pose the auto-fit can read: arms level and locked, gaps at the arms and legs.'
category: 'character'
template: 'A figure in a T-pose: arms extended straight out to both sides, horizontal, parallel to the ground, level with the shoulders, elbows locked straight, palms facing down, fingers together. Legs straight with a clear gap between them, feet flat and forward. Standing upright, facing forward. ${description}. Clothing, hair and capes follow the body and leave the gaps between arms and torso open. Weapons and gear stay against the body, inside the arm span. One complete figure, full body head to feet, centered, even lighting, no cast shadows, plain flat background.'
variables:
  - name: 'description'
    description: 'Character description (style, clothing, features)'
    required: true
examples:
  - 'a cowboy ninja in a fitted leather jacket, bandana mask, and dual katanas on the back'
  - 'a steampunk robot knight with brass armor and glowing eyes'
  - 'a muscular orc warrior with green skin and tribal tattoos'
  - 'a sleek android with white chassis and orange accents'
