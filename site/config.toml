title = "Asset Tap"
description = "The game-asset generation pipeline: prompt in, engine-ready bundle out."
base_url = "https://assettap.dev"

theme = "devlab-theme"

compile_sass = true
build_search_index = true
default_language = "en"

generate_feeds = false
taxonomies = [{ name = "tags" }]

[search]
index_format = "elasticlunr_javascript"
include_title = true
include_description = true
include_content = true

[markdown]
insert_anchor_links = "right"

[markdown.highlighting]
style = "class"
light_theme = "github-light"
dark_theme = "github-dark"

[slugify]
paths = "on"
taxonomies = "on"
anchors = "on"

[extra]
meta_description = "Asset Tap is the game-asset generation pipeline: prompt in, engine-ready bundle out via CLI, desktop app, and MCP."
keywords = "3d, ai, text-to-3d, asset generation, glb, fbx, blender, rust"
home_layout = "wide"
home_eyebrow = "Agent-native asset pipeline"
home_primary_action_label = "Get started"
home_primary_action_path = "/docs/getting-started/"
home_secondary_action_label = "Download"
home_secondary_action_path = "/download/"

[extra.devlab.brand]
logo_text = "Asset Tap"
footer_text = "Asset Tap | Night and Wknd"
show_logo_mark = true
logo_mark_path = "/images/icon.png"

[extra.devlab.footer]
note = "The game-asset generation pipeline."
links = [
  { name = "GitHub", path = "https://github.com/nightandwknd/asset-tap", icon = "github" },
]

[extra.devlab.navigation]
links = [
  { name = "Home", path = "/" },
  { name = "Docs", path = "/docs/", kind = "docs" },
  { name = "Download", path = "/download/" },
]

[extra.devlab.docs]
section = "docs/_index.md"
path = "/docs/"
get_started_path = "/docs/getting-started/"
navigation = [
  { section = "docs/getting-started/_index.md" },
  { section = "docs/guides/_index.md" },
]

[extra.devlab.appearance]
default_mode = "system"
show_toggle = true

[extra.devlab.i18n]
rtl_languages = []

[extra.devlab.search]
index = ""

[extra.devlab.seo]
og_image = "/images/og-preview.png"
