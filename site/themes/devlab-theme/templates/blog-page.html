{% extends "base.html" %}

{% block content %}
<article class="content">
  {% include "partials/blog-breadcrumbs.html" %}

  <header class="page-header">
    {% include "partials/post-meta.html" %}

    <h1>{{ page.title }}</h1>

    {% if page.description %}
    <p class="page-description">
      {{ page.description }}
    </p>
    {% endif %}
  </header>

  {{ page.content | safe }}
</article>
{% endblock content %}
