<div class="site-menu-backdrop" data-site-menu-backdrop hidden></div>

<div
  id="site-menu"
  class="site-menu"
  role="dialog"
  aria-label="Mobile navigation"
  aria-modal="true"
  aria-hidden="true"
  data-site-menu
  data-site-menu-initial-panel="{% if has_docs_navigation_panel and is_docs_page %}docs{% else %}main{% endif %}"
  inert
>
  <div class="site-menu-header">
    <p class="site-menu-title">{{ config.extra.menu_label | default(value="Menu") }}</p>

    <button
      class="site-menu-close"
      type="button"
      aria-label="{{ config.extra.menu_close_label | default(value='Close menu') }}"
      data-site-menu-close
    >
      &times;
    </button>
  </div>

  {% include "partials/devlab/site-menu/main-panel.html" %}
  {% include "partials/devlab/site-menu/docs-panel.html" %}
</div>
