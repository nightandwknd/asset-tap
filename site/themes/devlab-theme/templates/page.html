{% extends "base.html" %}

{% block content %}
<article class="content">
  <header class="page-header">
    <h1>{{ page.title }}</h1>

    {% if page.description %}
    <p class="page-description">
      {{ page.description }}
    </p>
    {% endif %}
  </header>

  {{ page.content | safe }}
</article>
{% endblock content %}
