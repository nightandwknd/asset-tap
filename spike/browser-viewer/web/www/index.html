<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Browser viewer feasibility spike</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  html, body { margin: 0; height: 100%; background: #1b1b1f; color: #ddd; font: 13px/1.4 system-ui, sans-serif; }
  #wrap { display: grid; grid-template-rows: 1fr auto; height: 100%; }
  canvas { width: 100%; height: 100%; display: block; outline: none; }
  #status { margin: 0; padding: 6px 10px; background: #111; color: #9fe39f; font: 12px/1.35 ui-monospace, monospace; white-space: pre-wrap; max-height: 28vh; overflow: auto; }
  #err { color: #ff8a8a; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="canvas" tabindex="0"></canvas>
  <pre id="status">starting… (query: ?glb=fixtures/mannequin_g4_baked.glb)</pre>
</div>
<script type="module">
  const q = new URLSearchParams(location.search);
  const glb = q.get('glb') ?? 'fixtures/mannequin_g4_baked.glb';
  const st = document.getElementById('status');
  window.addEventListener('error', e => { st.innerHTML += '\n<span id="err">window error: ' + e.message + '</span>'; });
  window.addEventListener('unhandledrejection', e => { st.innerHTML += '\n<span id="err">unhandled rejection: ' + e.reason + '</span>'; });
  try {
    const gl2 = document.createElement('canvas').getContext('webgl2');
    if (!gl2) throw new Error('WebGL2 is not available in this browser/profile');
    const mod = await import('./pkg/browser_viewer_web.js');
    await mod.default();
    // `start` resolves after the app is created and keeps running via requestAnimationFrame.
    mod.start('canvas', glb).catch(e => { st.innerHTML += '\n<span id="err">start() failed: ' + e + '</span>'; });
    setInterval(() => { st.textContent = 'window.__viewerStatus =\n' + JSON.stringify(JSON.parse(window.__viewerStatus ?? '{}'), null, 2); }, 500);
  } catch (e) { st.innerHTML = '<span id="err">init failed: ' + e + '</span>'; }
</script>
</body>
</html>
