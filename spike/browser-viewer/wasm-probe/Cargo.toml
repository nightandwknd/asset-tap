[package]
name = "wasm-probe"
version = "0.0.0"
edition = "2024"
publish = false
description = "DOM-free wasm32-unknown-unknown probe (same target as the browser) driven from Node"

[lib]
crate-type = ["cdylib"]

[dependencies]
asset-tap-core = { path = "../shim-core", package = "asset-tap-core-shim" }
rayon = "1.10"
gltf = { version = "1.4", features = ["KHR_materials_unlit", "extras"] }
wasm-bindgen = "0.2"
js-sys = "0.3"
