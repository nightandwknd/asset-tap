[package]
name = "asset-tap-core-shim"
version = "0.0.0"
edition = "2024"
publish = false
description = "Spike: the REAL core/src/rig tree compiled via #[path], with stand-ins for the few seams to the rest of core"

[lib]
name = "asset_tap_core"   # so unmodified gui code that says `asset_tap_core::X` resolves here

[dependencies]
glam = "0.30"
gltf = { version = "1.4", features = ["KHR_materials_unlit", "extras"] }
image = { version = "0.25", features = ["webp"] }
rayon = "1.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
zip = { version = "9", default-features = false, features = ["deflate"] }
tempfile = "3.8"
tokio = { version = "1", default-features = false, features = ["rt"] }
